{% extends "base.html" %}
{% block title %}Add Customer – InvoiceTracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add New Customer</h1>
    <a href="{{ url_for('customers') }}" class="btn btn-outline">← Back</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('add_customer') }}">

        <div class="form-group">
            <label for="name">Customer Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="e.g. John Smith"
                   required class="form-input" />
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="e.g. john@example.com"
                   class="form-input" />
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="e.g. +1 555-0100"
                   class="form-input" />
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Customer</button>
            <a href="{{ url_for('customers') }}" class="btn btn-outline">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
